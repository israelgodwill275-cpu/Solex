<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Facebook - Connexion</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html,
        body {
            width: 100%;
            min-height: 100%;
            background: #000000;
            font-family: Arial, Helvetica, sans-serif;
            color: #ffffff;
        }

        body {
            overflow-x: hidden;
        }

        /* Ligne tout en haut */
        .top-line {
            width: 100%;
            height: 1px;
            background: #333333;
        }

        /* Langue */
        .language {
            width: 100%;
            text-align: center;
            margin-top: 42px;
            color: #b0b3b8;
            font-size: 28px;
            font-weight: 400;
        }

        /* Logo Facebook */
        .logo-container {
            width: 100%;
            display: flex;
            justify-content: center;
            margin-top: 105px;
            margin-bottom: 188px;
        }

        .facebook-logo {
            width: 180px;
            height: 180px;
            background: #1877f2;
            border-radius: 50%;
            position: relative;
            overflow: hidden;
        }

        /* Partie blanche du F */
        .facebook-logo::before {
            content: "";
            position: absolute;

            width: 52px;
            height: 112px;

            background: #ffffff;

            left: 66px;
            top: 42px;

            border-radius: 6px 6px 0 0;
        }

        /* Barre horizontale du F */
        .facebook-logo::after {
            content: "";

            position: absolute;

            width: 84px;
            height: 25px;

            background: #ffffff;

            left: 47px;
            top: 79px;
        }

        /* Découpe bleue du F */
        .facebook-logo {
    width: 68px;
    height: 68px;
    object-fit: contain;
    display: block;
    margin: 0 auto 18px;
}
        /* Zone de connexion */
        .login-container {
            width: calc(100% - 96px);
            margin: 0 auto;
        }

        /* Champs */
        .input {
            display: block;

            width: 100%;
            height: 145px;

            padding: 0 50px;

            margin-bottom: 38px;

            background: #000000;

            border: 2px solid #3a3b3c;
            border-radius: 43px;

            outline: none;

            color: #ffffff;
            font-size: 37px;

            font-family: Arial, Helvetica, sans-serif;
        }

        .input::placeholder {
            color: #b0b3b8;
            opacity: 1;
        }

        .input:focus {
            border-color: #1877f2;
        }

        /* Bouton Se connecter */
        .login-button {
            display: block;

            width: 100%;
            height: 132px;

            margin: 0;

            border: none;
            border-radius: 70px;

            background: #0866ff;

            color: #ffffff;

            font-size: 37px;
            font-weight: 600;

            cursor: pointer;
        }

        .login-button:active {
            transform: scale(0.99);
        }

        /* Mot de passe oublié */
        .forgot {
            display: block;

            margin-top: 67px;

            text-align: center;

            color: #ffffff;

            font-size: 35px;
            font-weight: 700;

            text-decoration: none;
        }

        /* Zone créer un compte */
        .create-container {
            width: calc(100% - 96px);

            margin: 302px auto 0;
        }

        /* Bouton créer un compte */
        .create-button {
            display: block;

            width: 100%;
            height: 132px;

            border: 3px solid #4599ff;
            border-radius: 70px;

            background: #000000;

            color: #4599ff;

            font-size: 35px;
            font-weight: 500;

            cursor: pointer;
        }

        .create-button:active {
            transform: scale(0.99);
        }

        /* Logo Meta */
        .meta {
            width: 100%;

            margin-top: 50px;

            text-align: center;

            color: #ffffff;

            font-size: 38px;
            font-weight: 600;
        }

        .meta-symbol {
            display: inline-block;

            margin-right: 8px;

            color: #4599ff;

            font-size: 53px;
            font-weight: bold;

            transform: scaleX(1.15);
        }

        /* Liens du bas */
        .footer {
            display: flex;

            justify-content: center;
            align-items: center;

            gap: 25px;

            margin-top: 58px;
            padding-bottom: 28px;

            font-size: 27px;
        }

        .footer a {
            color: #b0b3b8;
            text-decoration: none;
        }

        /* ========================= */
        /* ADAPTATION MOBILE */
        /* ========================= */

        @media (max-width: 600px) {

            .language {
                margin-top: 27px;
                font-size: 18px;
            }

            .logo-container {
                margin-top: 75px;
                margin-bottom: 105px;
            }

            .facebook-logo {
                width: 92px;
                height: 92px;
            }

            .facebook-logo::before {
                width: 27px;
                height: 57px;

                left: 34px;
                top: 21px;

                border-radius: 3px 3px 0 0;
            }

            .facebook-logo::after {
                width: 43px;
                height: 13px;

                left: 24px;
                top: 40px;
            }

            .f-cut {
                width: 20px;
                height: 24px;

                left: 41px;
                top: 21px;
            }

            .login-container {
                width: calc(100% - 48px);
            }

            .input {
                width: 100%;
                height: 72px;

                padding: 0 25px;

                margin-bottom: 19px;

                border-radius: 23px;

                font-size: 18px;
            }

            .login-button {
                height: 67px;

                border-radius: 40px;

                font-size: 19px;
            }

            .forgot {
                margin-top: 34px;
                font-size: 18px;
            }

            .create-container {
                width: calc(100% - 48px);

                margin-top: 150px;
            }

            .create-button {
                height: 67px;

                border-width: 2px;
                border-radius: 40px;

                font-size: 18px;
            }

            .meta {
                margin-top: 25px;
                font-size: 20px;
            }

            .meta-symbol {
                margin-right: 4px;
                font-size: 27px;
            }

            .footer {
                margin-top: 30px;
                padding-bottom: 20px;

                gap: 16px;

                font-size: 15px;
            }
        }
    </style>
</head>

<body>

    <!-- Ligne supérieure -->
    <div class="top-line"></div>

    <!-- Langue -->
    <div class="language">
        Français (France)
    </div>


    <!-- Logo Facebook -->
    <div class="logo-container">

        <div class="facebook-logo">
                        <img

                src="facebook-logo.png"

                alt="Facebook"

                class="facebook-logo"
        </div>

    </div>


    <!-- Connexion -->
    <main class="login-container">

        <input
            type="text"
            class="input"
            placeholder="Numéro mobile ou e-mail"
            autocomplete="username"
        >

        <input
            type="password"
            class="input"
            placeholder="Mot de passe"
            autocomplete="current-password"
        >

        <button
            type="button"
            class="login-button"
        >
            Se connecter
        </button>

        <a
            href="#"
            class="forgot"
        >
            Mot de passe oublié ?
        </a>

    </main>


    <!-- Création de compte -->
    <div class="create-container">

        <button
            type="button"
            class="create-button"
        >
            Créer un nouveau compte
        </button>

    </div>


    <!-- Meta -->
    <div class="meta">

        <span class="meta-symbol">∞</span>
        Meta

    </div>


    <!-- Footer -->
    <footer class="footer">

        <a href="#">À propos</a>

        <a href="#">Aide</a>

        <a href="#">Plus</a>

    </footer>

</body>
</html>
