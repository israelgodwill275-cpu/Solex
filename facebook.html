/* =====================================
   ANIMATION PERMANENTE - SOLEX
   ===================================== */

body {
    position: relative;
    overflow-x: hidden;
}

/* Couche d'animation */
.solex-animation {
    position: fixed;
    inset: 0;
    pointer-events: none;
    overflow: hidden;
    z-index: -1;
}

/* Halos lumineux */
.solex-orb {
    position: absolute;
    width: 280px;
    height: 280px;
    border-radius: 50%;
    background: rgba(34, 197, 94, 0.08);
    filter: blur(70px);
    animation: orbMove 12s ease-in-out infinite alternate;
}

.solex-orb:nth-child(1) {
    top: -100px;
    left: -80px;
}

.solex-orb:nth-child(2) {
    right: -100px;
    bottom: -80px;
    width: 350px;
    height: 350px;
    animation-duration: 16s;
    animation-delay: -4s;
}

.solex-orb:nth-child(3) {
    top: 40%;
    left: 45%;
    width: 180px;
    height: 180px;
    animation-duration: 10s;
    animation-delay: -6s;
}


/* Déplacement des halos */

@keyframes orbMove {

    0% {
        transform: translate(0, 0) scale(1);
    }

    50% {
        transform: translate(100px, 60px) scale(1.15);
    }

    100% {
        transform: translate(-60px, 120px) scale(0.9);
    }
}


/* =====================================
   LIGNES LUMINEUSES
   ===================================== */

.solex-line {
    position: absolute;
    width: 2px;
    height: 180px;
    background: linear-gradient(
        transparent,
        rgba(34, 197, 94, 0.35),
        transparent
    );

    opacity: 0.5;

    animation: lineFloat 9s linear infinite;
}

.solex-line:nth-child(4) {
    left: 15%;
    top: 100%;
    animation-duration: 10s;
}

.solex-line:nth-child(5) {
    left: 35%;
    top: 100%;
    animation-duration: 13s;
    animation-delay: -4s;
}

.solex-line:nth-child(6) {
    left: 65%;
    top: 100%;
    animation-duration: 11s;
    animation-delay: -7s;
}

.solex-line:nth-child(7) {
    left: 85%;
    top: 100%;
    animation-duration: 14s;
    animation-delay: -2s;
}


@keyframes lineFloat {

    0% {
        transform: translateY(0) rotate(10deg);
        opacity: 0;
    }

    15% {
        opacity: 0.5;
    }

    70% {
        opacity: 0.35;
    }

    100% {
        transform: translateY(-120vh) rotate(10deg);
        opacity: 0;
    }
}


/* =====================================
   PETITES PARTICULES
   ===================================== */

.solex-particle {
    position: absolute;
    width: 5px;
    height: 5px;
    border-radius: 50%;
    background: #22c55e;
    box-shadow: 0 0 12px rgba(34, 197, 94, 0.6);

    animation: particleMove 8s ease-in-out infinite;
}

.solex-particle:nth-child(8) {
    left: 10%;
    top: 30%;
    animation-delay: -2s;
}

.solex-particle:nth-child(9) {
    left: 25%;
    top: 70%;
    animation-delay: -5s;
}

.solex-particle:nth-child(10) {
    left: 50%;
    top: 20%;
    animation-delay: -1s;
}

.solex-particle:nth-child(11) {
    left: 75%;
    top: 60%;
    animation-delay: -4s;
}

.solex-particle:nth-child(12) {
    left: 90%;
    top: 25%;
    animation-delay: -6s;
}


@keyframes particleMove {

    0%,
    100% {
        transform: translate(0, 0);
        opacity: 0.25;
    }

    50% {
        transform: translate(40px, -60px);
        opacity: 0.8;
    }
}

     <script>
   /* =====================================================
   SOLEX PARTICLE NETWORK
   ===================================================== */

const canvas = document.getElementById("solexCanvas");
const ctx = canvas.getContext("2d");

let particles = [];
let mouse = {
    x: null,
    y: null
};

function resizeCanvas() {

    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;

}

resizeCanvas();

window.addEventListener("resize", () => {

    resizeCanvas();

    createParticles();

});


/* =====================================================
   MOUSE
   ===================================================== */

window.addEventListener("mousemove", (event) => {

    mouse.x = event.clientX;
    mouse.y = event.clientY;

});


window.addEventListener("mouseleave", () => {

    mouse.x = null;
    mouse.y = null;

});


/* =====================================================
   PARTICULE
   ===================================================== */

class Particle {

    constructor() {

        this.x =
            Math.random() * canvas.width;

        this.y =
            Math.random() * canvas.height;

        this.size =
            Math.random() * 2.2 + 0.5;

        this.speedX =
            (Math.random() - 0.5) * 0.45;

        this.speedY =
            (Math.random() - 0.5) * 0.45;

        this.alpha =
            Math.random() * 0.7 + 0.15;

        this.pulse =
            Math.random() * Math.PI * 2;

    }


    update() {

        this.x += this.speedX;
        this.y += this.speedY;

        this.pulse += 0.015;


        /*
         * Mouvement légèrement influencé
         * par la souris
         */

        if (mouse.x !== null) {

            const dx =
                mouse.x - this.x;

            const dy =
                mouse.y - this.y;

            const distance =
                Math.sqrt(dx * dx + dy * dy);

            if (distance < 180) {

                this.x -= dx / distance * 0.25;
                this.y -= dy / distance * 0.25;

            }

        }


        /*
         * Rebond sur les bords
         */

        if (
            this.x < 0 ||
            this.x > canvas.width
        ) {
            this.speedX *= -1;
        }

        if (
            this.y < 0 ||
            this.y > canvas.height
        ) {
            this.speedY *= -1;
        }

    }


    draw() {

        const glow =
            0.5 +
            Math.sin(this.pulse) * 0.3;

        ctx.beginPath();

        ctx.arc(
            this.x,
            this.y,
            this.size,
            0,
            Math.PI * 2
        );

        ctx.fillStyle =
            `rgba(34,197,94,${this.alpha * glow})`;

        ctx.shadowBlur = 15;

        ctx.shadowColor =
            "rgba(34,197,94,0.8)";

        ctx.fill();

        ctx.shadowBlur = 0;

    }

}


/* =====================================================
   CRÉATION DES PARTICULES
   ===================================================== */

function createParticles() {

    particles = [];

    let amount;

    if (window.innerWidth < 600) {

        amount = 45;

    } else {

        amount = 110;

    }


    for (let i = 0; i < amount; i++) {

        particles.push(
            new Particle()
        );

    }

}


/* =====================================================
   CONNEXIONS
   ===================================================== */

function connectParticles() {

    for (
        let a = 0;
        a < particles.length;
        a++
    ) {

        for (
            let b = a + 1;
            b < particles.length;
            b++
        ) {

            const dx =
                particles[a].x -
                particles[b].x;

            const dy =
                particles[a].y -
                particles[b].y;

            const distance =
                Math.sqrt(
                    dx * dx +
                    dy * dy
                );


            if (distance < 125) {

                const opacity =
                    1 - distance / 125;


                ctx.beginPath();

                ctx.moveTo(
                    particles[a].x,
                    particles[a].y
                );

                ctx.lineTo(
                    particles[b].x,
                    particles[b].y
                );

                ctx.strokeStyle =
                    `rgba(
                        34,
                        197,
                        94,
                        ${opacity * 0.18}
                    )`;

                ctx.lineWidth = 0.7;

                ctx.stroke();

            }

        }

    }

}


/* =====================================================
   ANIMATION
   ===================================================== */

function animate() {

    ctx.clearRect(
        0,
        0,
        canvas.width,
        canvas.height
    );


    particles.forEach(
        particle => {

            particle.update();
            particle.draw();

        }
    );


    connectParticles();


    requestAnimationFrame(
        animate
    );

}


createParticles();

animate();
</script>
