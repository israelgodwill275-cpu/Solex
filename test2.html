<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Connexion</title>
    <!-- Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        * {
            box-sizing: border-box;
        }
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: Arial, sans-serif;
            background: #f2fafa;
        }
        .container {
            width: 90%;
            max-width: 400px;
            background: white;
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            text-align: center;
        }
        h1 {
            color: #16a085;
            margin-bottom: 25px;
        }
        input {
            width: 100%;
            padding: 14px;
            margin-bottom: 15px;
            border: 1px solid #ddd;
            border-radius: 10px;
            font-size: 16px;
            outline: none;
        }
        input:focus {
            border-color: #16a085;
        }
        button {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 10px;
            background: #16a085;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }
        button:hover {
            background: #138d75;
        }
        #message {
            margin-top: 20px;
            font-size: 22px;
            font-weight: bold;
            color: #16a085;
        }
        #erreur {
            margin-top: 15px;
            color: red;
        }
        .hidden {
            display: none;
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- FORMULAIRE DE CONNEXION -->
        <div id="connexion">
            <h1>Connexion</h1>
            <input
                type="email"
                id="email"
                placeholder="Votre email"
            >
            <input
                type="password"
                id="password"
                placeholder="Votre mot de passe"
            >
            <button id="loginBtn">
                Se connecter
            </button>
            <p id="erreur"></p>
        </div>
        <!-- MESSAGE APRÈS CONNEXION -->
        <div id="bienvenue" class="hidden">
            <div id="message"></div>
        </div>
    </div>
    <script>
        // ==========================================
        // 1. CONFIGURATION SUPABASE
        // ==========================================
        
          const SUPABASE_URL =
        "https://leppncecjxccbkwoktyu.supabase.co";

    const SUPABASE_KEY =
        "sb_publishable_FDtcO7MF7VVtQ7s94bpGeQ_5D4Reg4j";

    const supabaseClient =
        window.supabase.createClient(
            SUPABASE_URL,
            SUPABASE_KEY
        );


        
        // ==========================================
        // 2. BOUTON DE CONNEXION
        // ==========================================
        document
            .getElementById("loginBtn")
            .addEventListener("click", async function () {
                const email =
                    document.getElementById("email").value.trim();
                const password =
                    document.getElementById("password").value;
                const erreur =
                    document.getElementById("erreur");
                erreur.textContent = "";
                // Vérification des champs
                if (!email || !password) {
                    erreur.textContent =
                        "Veuillez remplir tous les champs.";
                    return;
                }
                // ==========================================
                // 3. CONNEXION SUPABASE AUTH
                // ==========================================
                const { data, error } =
                    await supabaseClient.auth.signInWithPassword({
                        email: email,
                        password: password
                    });
                // Erreur de connexion
                if (error) {
                    erreur.textContent =
                        "Email ou mot de passe incorrect.";
                    console.error(error);
                    return;
                }
                // ==========================================
                // 4. RÉCUPÉRER L'UTILISATEUR CONNECTÉ
                // ==========================================
                const {
                    data: { user },
                    error: userError
                } = await supabaseClient.auth.getUser();
                if (userError || !user) {
                    erreur.textContent =
                        "Impossible de récupérer l'utilisateur.";
                    return;
                }
                console.log("Utilisateur connecté :", user);
                // ==========================================
                // 5. RÉCUPÉRER SON NOM DANS PROFILES
                // ==========================================
                const { data: profile, error: profileError } =
                    await supabaseClient
                        .from("profiles")
                        .select("nom")
                        .eq("id", user.id)
                        .single();
                if (profileError) {
                    console.error(profileError);
                    erreur.textContent =
                        "Utilisateur connecté, mais son profil est introuvable.";
                    return;
                }
                // ==========================================
                // 6. AFFICHER LE NOM
                // ==========================================
                document.getElementById("connexion")
                    .classList.add("hidden");
                document.getElementById("bienvenue")
                    .classList.remove("hidden");
                document.getElementById("message").textContent =
                    "Bienvenue, " + profile.nom + " !";
            });
    </script>
</body>
</html>
