<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Validation — Solex</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            background: #000;
            color: #fff;
            font-family: Arial, Helvetica, sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        /* Fond lumineux Solex */
        .background {
            position: fixed;
            inset: 0;
            overflow: hidden;
            z-index: -1;
        }

        .orb {
            position: absolute;
            width: 240px;
            height: 240px;
            border-radius: 50%;
            background: rgba(0, 255, 200, 0.08);
            filter: blur(75px);
            animation: float 8s ease-in-out infinite;
        }

        .orb:first-child {
            top: -100px;
            left: -100px;
        }

        .orb:last-child {
            right: -110px;
            bottom: -100px;
            animation-delay: -4s;
        }

        @keyframes float {
            0%, 100% {
                transform: translate(0, 0);
            }

            50% {
                transform: translate(30px, -25px);
            }
        }

        /* Bloc principal */
        .container {
            width: calc(100% - 32px);
            max-width: 390px;
            padding: 38px 25px;
            text-align: center;

            background: rgba(10, 10, 10, 0.94);
            border: 1px solid rgba(0, 255, 200, 0.18);
            border-radius: 24px;

            box-shadow:
                0 0 35px rgba(0, 255, 200, 0.08),
                0 20px 60px rgba(0, 0, 0, 0.7);
        }

        /* Logo */
        .logo {
            width: 70px;
            height: 70px;
            margin: 0 auto 23px;

            display: flex;
            align-items: center;
            justify-content: center;

            border-radius: 20px;
            border: 1px solid rgba(0, 255, 200, 0.35);

            color: #00ffc8;
            font-size: 27px;
            font-weight: 800;
            letter-spacing: -2px;

            box-shadow: 0 0 25px rgba(0, 255, 200, 0.12);
        }

        .title {
            font-size: 24px;
            font-weight: 700;
            margin-bottom: 13px;
        }

        .message {
            color: #a0a0a0;
            font-size: 15px;
            line-height: 1.6;
        }

        .highlight {
            color: #00ffc8;
            font-weight: 600;
        }

        /* Icône d'attente */
        .loader {
            width: 58px;
            height: 58px;
            margin: 27px auto;

            border-radius: 50%;
            border: 3px solid rgba(0, 255, 200, 0.12);
            border-top-color: #00ffc8;
            border-right-color: #00ffc8;

            animation: spin 1.1s linear infinite;

            box-shadow:
                0 0 20px rgba(0, 255, 200, 0.12);
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        .waiting {
            color: #00ffc8;
            font-size: 13px;
            font-weight: 600;
        }

        .info {
            margin-top: 20px;
            padding-top: 18px;
            border-top: 1px solid rgba(255, 255, 255, 0.06);

            color: #606060;
            font-size: 11px;
            line-height: 1.5;
        }

        .secure {
            margin-top: 18px;
            color: #555;
            font-size: 11px;
        }

        .secure span {
            color: #00ffc8;
        }

        @media (max-width: 360px) {
            .container {
                padding: 30px 20px;
            }

            .title {
                font-size: 21px;
            }

            .logo {
                width: 62px;
                height: 62px;
            }
        }
    </style>
</head>

<body>

    <div class="background">
        <div class="orb"></div>
        <div class="orb"></div>
    </div>

    <main class="container">

        <div class="logo">
            SX
        </div>

        <h1 class="title">
            Compte en attente
        </h1>

        <p class="message">
            Votre compte <span class="highlight">Solex</span>
            est en attente de validation.
        </p>

        <div class="loader"></div>

        <div class="waiting">
            Validation en attente...
        </div>

        <p class="info">
            Votre inscription a bien été enregistrée.
            Vous pourrez accéder à votre compte une fois
            la validation terminée.
        </p>

        <div class="secure">
            <span>●</span> Solex
        </div>

    </main>

</body>
</html>
