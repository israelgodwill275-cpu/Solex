<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Solex — Inscription réussie</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, Helvetica, sans-serif;
        }

        body {
            background: #050b18;
            color: white;
            min-height: 100vh;
            overflow: hidden;
        }

        /* =========================
           BACKGROUND SOLEX
           ========================= */

        #solex-background {
            position: fixed;
            inset: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            z-index: -3;
            background: #050b18;
        }

        #solexCanvas {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
        }

        .solex-glow {
            position: absolute;
            width: 350px;
            height: 350px;
            border-radius: 50%;
            filter: blur(100px);
            pointer-events: none;
        }

        .glow-1 {
            background: rgba(34, 197, 94, 0.12);
            top: -100px;
            left: -100px;
        }

        .glow-2 {
            background: rgba(34, 197, 94, 0.08);
            bottom: -100px;
            right: -100px;
        }

        .glow-3 {
            background: rgba(55, 230, 161, 0.06);
            top: 40%;
            left: 45%;
        }

        .solex-grid {
            position: absolute;
            inset: 0;

            background-image:
                linear-gradient(
                    rgba(55, 230, 161, 0.025) 1px,
                    transparent 1px
                ),
                linear-gradient(
                    90deg,
                    rgba(55, 230, 161, 0.025) 1px,
                    transparent 1px
                );

            background-size: 60px 60px;
            mask-image: linear-gradient(
                to bottom,
                transparent,
                black,
                transparent
            );
        }

        .solex-ring {
            position: absolute;
            border: 1px solid rgba(55, 230, 161, 0.05);
            border-radius: 50%;
            left: 50%;
            top: 50%;
            transform: translate(-50%, -50%);
        }

        .ring-1 {
            width: 300px;
            height: 300px;
            animation: ringPulse 8s ease-in-out infinite;
        }

        .ring-2 {
            width: 550px;
            height: 550px;
            animation: ringPulse 10s ease-in-out infinite reverse;
        }

        .ring-3 {
            width: 800px;
            height: 800px;
            animation: ringPulse 12s ease-in-out infinite;
        }

        @keyframes ringPulse {
            0%, 100% {
                transform: translate(-50%, -50%) scale(0.95);
                opacity: 0.3;
            }

            50% {
                transform: translate(-50%, -50%) scale(1.05);
                opacity: 1;
            }
        }

        /* =========================
           LUMIÈRES FLOTTANTES
           ========================= */

        body::before {
            content: "";
            position: fixed;
            width: 300px;
            height: 300px;
            border-radius: 50%;
            background: rgba(34, 197, 94, 0.12);
            filter: blur(80px);
            top: -100px;
            left: -100px;
            z-index: -2;
            animation: floatingLight 6s ease-in-out infinite alternate;
        }

        body::after {
            content: "";
            position: fixed;
            width: 250px;
            height: 250px;
            border-radius: 50%;
            background: rgba(34, 197, 94, 0.08);
            filter: blur(70px);
            bottom: -80px;
            right: -80px;
            z-index: -2;
            animation: floatingLight2 7s ease-in-out infinite alternate;
        }

        @keyframes floatingLight {
            from {
                transform: translate(0, 0);
            }

            to {
                transform: translate(120px, 100px);
            }
        }

        @keyframes floatingLight2 {
            from {
                transform: translate(0, 0);
            }

            to {
                transform: translate(-100px, -80px);
            }
        }

        /* =========================
           CONTENU
           ========================= */

        .page {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 25px;
        }

        .success-box {
            width: 100%;
            max-width: 440px;
            text-align: center;

            background: rgba(11, 20, 38, 0.88);

            border: 1px solid rgba(55, 230, 161, 0.15);

            border-radius: 24px;

            padding: 45px 30px;

            backdrop-filter: blur(15px);

            box-shadow:
                0 25px 80px rgba(0, 0, 0, 0.45),
                0 0 50px rgba(55, 230, 161, 0.05);

            animation: boxAppear 0.8s ease forwards;
        }

        @keyframes boxAppear {
            from {
                opacity: 0;
                transform: translateY(30px) scale(0.96);
            }

            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        /* =========================
           LOGO
           ========================= */

        .logo {
            font-size: 30px;
            font-weight: 800;
            letter-spacing: -1px;
            margin-bottom: 35px;
        }

        .logo span {
            color: #37e6a1;
        }

        /* =========================
           ICÔNE
           ========================= */

        .success-icon {
            width: 82px;
            height: 82px;

            margin: 0 auto 25px;

            display: flex;
            align-items: center;
            justify-content: center;

            border-radius: 50%;

            background: rgba(55, 230, 161, 0.08);

            border: 1px solid rgba(55, 230, 161, 0.25);

            color: #37e6a1;

            font-size: 42px;

            box-shadow:
                0 0 35px rgba(55, 230, 161, 0.12);

            animation: successPulse 2s ease-in-out infinite;
        }

        @keyframes successPulse {
            0%, 100% {
                transform: scale(1);
            }

            50% {
                transform: scale(1.06);
            }
        }

        /* =========================
           TEXTE
           ========================= */

        h1 {
            font-size: 30px;
            margin-bottom: 12px;
            letter-spacing: -1px;
        }

        h1 span {
            color: #37e6a1;
        }

        .description {
            color: #a8b2c5;
            font-size: 15px;
            line-height: 1.7;
            margin-bottom: 30px;
        }

        /* =========================
           BOUTON
           ========================= */

        .login-btn {
            width: 100%;

            padding: 15px;

            border: none;
            border-radius: 11px;

            background: #37e6a1;

            color: #03110b;

            font-size: 16px;
            font-weight: 700;

            cursor: pointer;

            transition:
                transform 0.25s ease,
                box-shadow 0.25s ease;
        }

        .login-btn:hover {
            transform: translateY(-3px);

            box-shadow:
                0 12px 30px rgba(55, 230, 161, 0.25);
        }

        .login-btn:active {
            transform: scale(0.97);
        }

        /* =========================
           PETIT TEXTE
           ========================= */

        .footer-text {
            margin-top: 22px;
            color: #657187;
            font-size: 12px;
        }

        /* =========================
           MOBILE
           ========================= */

        @media (max-width: 600px) {

            .page {
                padding: 18px;
            }

            .success-box {
                padding: 38px 24px;
                border-radius: 21px;
            }

            .logo {
                font-size: 27px;
                margin-bottom: 30px;
            }

            .success-icon {
                width: 75px;
                height: 75px;
                font-size: 37px;
            }

            h1 {
                font-size: 27px;
            }

            .description {
                font-size: 14px;
            }
        }
    </style>
</head>

<body>

    <!-- =========================
         BACKGROUND ANIMÉ SOLEX
         ========================= -->

    <div id="solex-background">

        <canvas id="solexCanvas"></canvas>

        <div class="solex-glow glow-1"></div>
        <div class="solex-glow glow-2"></div>
        <div class="solex-glow glow-3"></div>

        <div class="solex-grid"></div>

        <div class="solex-ring ring-1"></div>
        <div class="solex-ring ring-2"></div>
        <div class="solex-ring ring-3"></div>

    </div>


    <!-- =========================
         CONTENU
         ========================= -->

    <main class="page">

        <div class="success-box">

            <div class="logo">
                Sol<span>ex</span>
            </div>

            <div class="success-icon">
                ✓
            </div>

            <h1>
                Inscription <span>réussie !</span>
            </h1>

            <p class="description">
                Votre compte Solex a été créé avec succès.
                Vous pouvez maintenant vous connecter
                pour accéder à votre espace.
            </p>

            <button
                class="login-btn"
                onclick="window.location.href='index.html'"
            >
                Se connecter
            </button>

            <div class="footer-text">
                Bienvenue dans l'écosystème Solex.
            </div>

        </div>

    </main>


    <!-- =========================
         PARTICULES SOLEX
         ========================= -->

    <script>

        const canvas =
            document.getElementById("solexCanvas");

        const ctx =
            canvas.getContext("2d");

        let particles = [];

        let mouse = {
            x: null,
            y: null
        };


        function resizeCanvas() {

            canvas.width =
                window.innerWidth;

            canvas.height =
                window.innerHeight;

        }


        resizeCanvas();


        window.addEventListener(
            "resize",
            () => {

                resizeCanvas();

                createParticles();

            }
        );


        window.addEventListener(
            "mousemove",
            (event) => {

                mouse.x =
                    event.clientX;

                mouse.y =
                    event.clientY;

            }
        );


        window.addEventListener(
            "mouseleave",
            () => {

                mouse.x = null;
                mouse.y = null;

            }
        );


        class Particle {

            constructor() {

                this.x =
                    Math.random() *
                    canvas.width;

                this.y =
                    Math.random() *
                    canvas.height;

                this.size =
                    Math.random() * 2.2 + 0.5;

                this.speedX =
                    (Math.random() - 0.5) * 0.45;

                this.speedY =
                    (Math.random() - 0.5) * 0.45;

                this.alpha =
                    Math.random() * 0.7 + 0.15;

                this.pulse =
                    Math.random() *
                    Math.PI * 2;

            }


            update() {

                this.x +=
                    this.speedX;

                this.y +=
                    this.speedY;

                this.pulse +=
                    0.015;


                if (mouse.x !== null) {

                    const dx =
                        mouse.x - this.x;

                    const dy =
                        mouse.y - this.y;

                    const distance =
                        Math.sqrt(
                            dx * dx +
                            dy * dy
                        );


                    if (
                        distance < 180 &&
                        distance > 0
                    ) {

                        this.x -=
                            dx / distance * 0.25;

                        this.y -=
                            dy / distance * 0.25;

                    }

                }


                if (
                    this.x < 0 ||
                    this.x > canvas.width
                ) {

                    this.speedX *= -1;

                }


                if (
                    this.y < 0 ||
                    this.y > canvas.height
                ) {

                    this.speedY *= -1;

                }

            }


            draw() {

                const glow =
                    0.5 +
                    Math.sin(this.pulse) * 0.3;


                ctx.beginPath();


                ctx.arc(
                    this.x,
                    this.y,
                    this.size,
                    0,
                    Math.PI * 2
                );


                ctx.fillStyle =
                    `rgba(
                        34,
                        197,
                        94,
                        ${this.alpha * glow}
                    )`;


                ctx.shadowBlur = 15;


                ctx.shadowColor =
                    "rgba(34,197,94,0.8)";


                ctx.fill();


                ctx.shadowBlur = 0;

            }

        }


        function createParticles() {

            particles = [];

            let amount;


            if (window.innerWidth < 600) {

                amount = 45;

            } else {

                amount = 110;

            }


            for (
                let i = 0;
                i < amount;
                i++
            ) {

                particles.push(
                    new Particle()
                );

            }

        }


        function connectParticles() {

            for (
                let a = 0;
                a < particles.length;
                a++
            ) {

                for (
                    let b = a + 1;
                    b < particles.length;
                    b++
                ) {

                    const dx =
                        particles[a].x -
                        particles[b].x;

                    const dy =
                        particles[a].y -
                        particles[b].y;


                    const distance =
                        Math.sqrt(
                            dx * dx +
                            dy * dy
                        );


                    if (distance < 125) {

                        const opacity =
                            1 - distance / 125;


                        ctx.beginPath();


                        ctx.moveTo(
                            particles[a].x,
                            particles[a].y
                        );


                        ctx.lineTo(
                            particles[b].x,
                            particles[b].y
                        );


                        ctx.strokeStyle =
                            `rgba(
                                34,
                                197,
                                94,
                                ${opacity * 0.18}
                            )`;


                        ctx.lineWidth = 0.7;


                        ctx.stroke();

                    }

                }

            }

        }


        function animate() {

            ctx.clearRect(
                0,
                0,
                canvas.width,
                canvas.height
            );


            particles.forEach(
                particle => {

                    particle.update();

                    particle.draw();

                }
            );


            connectParticles();


            requestAnimationFrame(
                animate
            );

        }


        createParticles();

        animate();

    </script>

</body>
</html>
