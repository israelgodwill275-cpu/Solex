<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Recherche utilisateur</title>

    <!-- Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>

        body {
            font-family: Arial, sans-serif;
            background: #f5f5f5;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }

        .box {
            background: white;
            width: 90%;
            max-width: 400px;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            text-align: center;
        }

        input {
            width: 100%;
            padding: 13px;
            margin-top: 15px;
            box-sizing: border-box;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 16px;
        }

        button {
            width: 100%;
            padding: 13px;
            margin-top: 15px;
            border: none;
            border-radius: 8px;
            background: #22c55e;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background: #16a34a;
        }

        #result {
            margin-top: 20px;
            font-size: 16px;
        }

    </style>

</head>


<body>


<div class="box">

    <h2>Rechercher un utilisateur</h2>

    <input
        type="text"
        id="username"
        placeholder="Entre le nom d'utilisateur"
    >

    <button onclick="findUser()">
        Rechercher
    </button>

    <div id="result"></div>

</div>


<script>

    /* ==========================================
       CONFIGURATION SUPABASE
       ========================================== */

    const SUPABASE_URL =
        
        "https://leppncecjxccbkwoktyu.supabase.co";

    const SUPABASE_ANON_KEY =
        "sb_publishable_FDtcO7MF7VVtQ7s94bpGeQ_5D4Reg4j";


    const supabaseClient =
        supabase.createClient(
            SUPABASE_URL,
            SUPABASE_ANON_KEY
        );


    /* ==========================================
       RECHERCHE DE L'UTILISATEUR
       ========================================== */

    async function findUser() {

        const name =
            document
                .getElementById("username")
                .value
                .trim();


        const result =
            document.getElementById("result");


        if (!name) {

            result.textContent =
                "Veuillez entrer un nom.";

            return;

        }


        result.textContent =
            "Recherche en cours...";


        const { data, error } =
            await supabaseClient
                .from("profiles")
                .select("email")
                .eq("name", name)
                .maybeSingle();


        if (error) {

            console.error(error);

            result.textContent =
                "Une erreur est survenue.";

            return;

        }


        if (!data) {

            result.textContent =
                "Aucun utilisateur trouvé.";

            return;

        }


        result.textContent =
            "Email : " + data.email;

    }

</script>


</body>

</html>
