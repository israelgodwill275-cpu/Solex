<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Solex - Inscription réussie</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;
            background: #000;
            color: #fff;
            font-family: Arial, sans-serif;

            display: flex;
            justify-content: center;
            align-items: center;

            padding: 20px;
        }

        /* Écran d'attente */
        #loading {
            text-align: center;
        }

        .loader {
            width: 50px;
            height: 50px;
            border: 4px solid #222;
            border-top: 4px solid #00ff88;
            border-radius: 50%;

            animation: spin 0.8s linear infinite;

            margin: 0 auto 20px;
        }

        @keyframes spin {
            from {
                transform: rotate(0deg);
            }

            to {
                transform: rotate(360deg);
            }
        }

        #loading p {
            color: #aaa;
            font-size: 15px;
        }

        /* Contenu final */
        #success {
            display: none;
            width: 100%;
            max-width: 420px;

            text-align: center;

            padding: 30px 22px;

            border: 1px solid #222;
            border-radius: 18px;

            background: #080808;

            box-shadow: 0 0 30px rgba(0, 255, 136, 0.08);
        }

        .check {
            width: 65px;
            height: 65px;

            margin: 0 auto 20px;

            border-radius: 50%;

            background: #00ff88;
            color: #000;

            display: flex;
            justify-content: center;
            align-items: center;

            font-size: 34px;
            font-weight: bold;
        }

        h1 {
            font-size: 25px;
            margin-bottom: 12px;
        }

        .description {
            color: #aaa;
            font-size: 15px;
            line-height: 1.5;

            margin-bottom: 25px;
        }

        .affiliate-title {
            color: #fff;
            font-size: 15px;
            margin-bottom: 10px;
        }

        .link-container {
            display: flex;
            width: 100%;
            gap: 8px;
        }

        #affiliate-link {
            flex: 1;
            min-width: 0;

            height: 45px;

            padding: 0 12px;

            border: 1px solid #333;
            border-radius: 9px;

            background: #111;
            color: #00ff88;

            font-size: 13px;

            outline: none;
        }

        #copy-button {
            height: 45px;

            padding: 0 17px;

            border: none;
            border-radius: 9px;

            background: #00ff88;
            color: #000;

            font-weight: bold;
            font-size: 14px;

            cursor: pointer;

            transition: 0.2s;
        }

        #copy-button:active {
            transform: scale(0.96);
        }

        #copy-message {
            display: none;

            margin-top: 12px;

            color: #00ff88;
            font-size: 13px;
        }

        @media (max-width: 380px) {
            #success {
                padding: 25px 15px;
            }

            #copy-button {
                padding: 0 12px;
            }

            #affiliate-link {
                font-size: 11px;
            }
        }
    </style>
</head>

<body>

    <!-- Écran affiché pendant 2 secondes -->
    <div id="loading">
        <div class="loader"></div>
        <p>Préparation de votre compte...</p>
    </div>


    <!-- Page finale -->
    <div id="success">

        <div class="check">✓</div>

        <h1>Inscription réussie !</h1>

        <p class="description">
            Votre compte Solex a été créé avec succès.
        </p>

        <p class="affiliate-title">
            Voici votre lien d’affiliation :
        </p>

        <div class="link-container">

            <input
                id="affiliate-link"
                type="text"
                value="https://solex-d3eh.onrender.com"
                readonly
            >

            <button id="copy-button" onclick="copyAffiliateLink()">
                Copier
            </button>

        </div>

        <p id="copy-message">
            ✓ Lien copié !
        </p>

    </div>


    <script>
        /*
         * Attendre exactement 2 secondes
         * avant d'afficher la page de succès.
         */
        setTimeout(function () {

            document.getElementById("loading").style.display = "none";

            document.getElementById("success").style.display = "block";

        }, 2000);


        /*
         * Copier le lien d'affiliation
         */
        function copyAffiliateLink() {

            const link = document.getElementById("affiliate-link").value;
            const message = document.getElementById("copy-message");

            navigator.clipboard.writeText(link)
                .then(function () {

                    message.style.display = "block";

                    setTimeout(function () {
                        message.style.display = "none";
                    }, 2000);

                })
                .catch(function () {

                    // Solution de secours si Clipboard API n'est pas disponible
                    const input = document.getElementById("affiliate-link");

                    input.select();
                    input.setSelectionRange(0, 99999);

                    document.execCommand("copy");

                    message.style.display = "block";

                    setTimeout(function () {
                        message.style.display = "none";
                    }, 2000);

                });
        }
    </script>

</body>
</html>
